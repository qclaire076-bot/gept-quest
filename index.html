<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英檢中級闖關島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#57B8F0; --sky-deep:#2F8FD6; --ink:#1B1B2F; --paper:#FFF6DC; --paper-ink:#1B1B2F;
  --muted:#6B6580; --coin:#FFC93C; --coin-deep:#E09B12; --heart:#E5383B; --good:#2FA866; --bad:#E5383B;
  --brick:#C8662B; --brick-line:#8E3F14; --grass:#45B649; --accent:#2E6FD8; --card:#FFFFFF; --page:#57B8F0;
  --locked:#A9A3B8; --shadow:rgba(27,27,47,.18);
  --px:"Press Start 2P", "Noto Sans TC", system-ui, sans-serif;
  --tc:"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#1E2C5E; --sky-deep:#141E45; --ink:#0E0E1C; --paper:#2B2744; --paper-ink:#F4EEDC;
    --muted:#B3ABCB; --card:#36315A; --page:#1E2C5E; --locked:#5D5778; --shadow:rgba(0,0,0,.4);
    --brick:#8E4A22; --brick-line:#5A2B10; --grass:#2E8A3A; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --sky:#1E2C5E; --sky-deep:#141E45; --ink:#0E0E1C; --paper:#2B2744; --paper-ink:#F4EEDC;
  --muted:#B3ABCB; --card:#36315A; --page:#1E2C5E; --locked:#5D5778; --shadow:rgba(0,0,0,.4);
  --brick:#8E4A22; --brick-line:#5A2B10; --grass:#2E8A3A; color-scheme: dark;
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--page);color:var(--paper-ink);font-family:var(--tc);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,.w:focus-visible{outline:3px dashed var(--coin);outline-offset:3px}
.hidden{display:none!important}

/* pixel frame: notched corners */
.px{background:var(--paper);color:var(--paper-ink);margin:4px;
  box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset 0 -4px 0 0 rgba(0,0,0,.08)}
.btn{border:0;background:var(--coin);color:#1B1B2F;font-weight:900;padding:12px 16px;margin:4px;
  box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset -4px -4px 0 0 var(--coin-deep);
  transition:transform .06s}
.btn:active{transform:translateY(2px)}
.btn.blue{background:var(--accent);color:#fff;box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset -4px -4px 0 0 #1D4FA3}
.btn.ghost{background:var(--card);color:var(--paper-ink);box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset -4px -4px 0 0 rgba(0,0,0,.12)}
.btn.small{padding:6px 10px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* top HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#FFF6DC;display:flex;align-items:center;gap:12px;padding:10px 14px}
.hud .title{font-family:var(--px);font-size:11px;line-height:1.5;flex:1;letter-spacing:.5px}
.hud .stat{display:flex;align-items:center;gap:6px;font-family:var(--px);font-size:11px}
.hud .streak{font-family:var(--tc);font-size:13px;font-weight:700;color:var(--coin)}

main{max-width:640px;margin:0 auto;padding:0 12px 120px}
.view{padding-top:12px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;border:0;background:none;color:#B9B3CF;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0}
.nav button[aria-current="page"]{color:var(--coin)}
.nav svg{width:22px;height:22px}

/* scenery */
.clouds{position:relative;height:56px;overflow:hidden}
.cloud{position:absolute;width:56px;height:16px;background:#fff;opacity:.9;box-shadow:16px -8px 0 -0px #fff,32px 0 0 #fff}
:root[data-theme="dark"] .cloud{opacity:.15}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cloud{opacity:.15}}
.ground{height:26px;background-color:var(--brick);border-top:6px solid var(--grass);
  background-image:linear-gradient(var(--brick-line) 2px,transparent 2px),linear-gradient(90deg,var(--brick-line) 2px,transparent 2px);
  background-size:24px 10px;background-position:0 -1px}

/* map */
.intro{display:flex;gap:14px;align-items:flex-end;padding:4px 4px 0}
.intro h1{font-family:var(--px);font-size:16px;line-height:1.7;margin:0;color:#fff;text-shadow:3px 3px 0 var(--ink)}
.intro p{margin:4px 0 0;color:#fff;font-weight:700;text-shadow:2px 2px 0 var(--ink);font-size:14px}
.world{margin:22px 0 0;position:relative}
.world .head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--wsky);color:#fff;
  box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink);margin:0 4px}
.world .badge{font-family:var(--px);font-size:11px;background:var(--ink);color:var(--coin);padding:6px 7px}
.world .name{font-weight:900;font-size:18px;line-height:1.2;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.world .sub{font-size:13px;opacity:.95;font-weight:700}
.world .stage-row{background:var(--wsky2);margin:0 4px;padding:18px 8px 6px;display:flex;justify-content:space-around;align-items:flex-end;position:relative;
  box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink)}
.world .stage-row.many{flex-wrap:wrap;justify-content:flex-start;row-gap:44px;padding-top:44px}
.world .stage-row.many .node{width:25%}
.world .stage-row.many::before{display:none}
.world .stage-row::before{content:"";position:absolute;left:16%;right:16%;top:44px;border-top:4px dotted rgba(255,255,255,.75)}
.world .ground{margin:0 4px;box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 4px 0 0 var(--ink)}
.node{position:relative;z-index:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;min-width:64px}
.node .block{width:52px;height:52px;display:grid;place-items:center;font-family:var(--px);font-size:14px;color:#1B1B2F;background:#F4D37A;
  box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset -5px -5px 0 0 #C9962B,inset 5px 5px 0 0 #FFF0B8}
.node.done .block{background:var(--coin)}
.node.boss .block{background:#F08A5D;box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset -5px -5px 0 0 #B8532A,inset 5px 5px 0 0 #FFC2A3}
.node.ai .block{background:#9C7BEA;color:#fff;font-size:11px;box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset -5px -5px 0 0 #6A4BC0,inset 5px 5px 0 0 #CDB9FF}
.node.locked .block{background:var(--locked);color:#fff;box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset -5px -5px 0 0 rgba(0,0,0,.2)}
.node .lab{font-size:12px;font-weight:900;color:#fff;text-shadow:1px 1px 0 var(--ink),-1px 1px 0 var(--ink),1px -1px 0 var(--ink),-1px -1px 0 var(--ink)}
.node .stars{display:flex;gap:1px;height:12px}
.node .hero{position:absolute;top:-38px;animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}

/* panels */
.panel{padding:16px}
.panel h2{font-size:20px;font-weight:900;margin:0 0 6px;line-height:1.3}
.panel h3{font-size:16px;font-weight:900;margin:14px 0 6px}
.lead{color:var(--muted);font-size:14px;margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.statbox{background:var(--card);padding:10px 12px;box-shadow:inset 0 0 0 3px var(--ink)}
.statbox .n{font-family:var(--px);font-size:16px;line-height:1.6}
.statbox .l{font-size:13px;color:var(--muted);font-weight:700}
.bar{height:22px;background:var(--card);box-shadow:inset 0 0 0 3px var(--ink);position:relative;overflow:hidden}
.bar > i{position:absolute;inset:3px auto 3px 3px;background:var(--good);
  background-image:repeating-linear-gradient(90deg,transparent 0 10px,rgba(255,255,255,.25) 10px 14px)}
.week{display:flex;gap:6px;margin-top:8px}
.week .d{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.week .d .sq{height:30px;margin-bottom:4px;background:var(--card);box-shadow:inset 0 0 0 3px var(--ink);display:grid;place-items:center}
.week .d.met .sq{background:var(--coin)}
.week .d.part .sq{background:#F8E3A6}
:root[data-theme="dark"] .week .d.part .sq{background:#6C5B2E}
.seg{display:flex;margin:4px}
.seg button{flex:1;border:0;padding:9px 6px;background:var(--card);font-weight:900;font-size:14px;box-shadow:inset 0 0 0 3px var(--ink)}
.seg button+button{margin-left:-3px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--coin)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 4px}
.chip{border:0;padding:5px 12px;font-size:13px;font-weight:700;background:var(--card);box-shadow:inset 0 0 0 2px var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}
input[type=text],input[type=search],textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:0;background:var(--card);color:var(--paper-ink);box-shadow:inset 0 0 0 3px var(--ink)}
textarea{min-height:96px;resize:vertical}
.item{background:var(--card);padding:12px;margin:10px 4px;box-shadow:inset 0 0 0 3px var(--ink)}
.item .t{font-weight:900;font-size:18px;line-height:1.3}
.item .meta{font-size:13px;color:var(--muted)}
.item .zh{margin:4px 0}
.item .ex{font-size:14px;color:var(--muted);font-style:italic}
.fam{display:flex;gap:6px;margin-top:8px}
.fam button{border:0;font-size:12px;font-weight:900;padding:4px 10px;background:transparent;box-shadow:inset 0 0 0 2px var(--ink)}
.fam button[aria-pressed="true"].f0{background:var(--heart);color:#fff}
.fam button[aria-pressed="true"].f1{background:var(--coin);color:#1B1B2F}
.fam button[aria-pressed="true"].f2{background:var(--good);color:#fff}
.log{border-collapse:collapse;width:100%;min-width:460px;font-size:13px;background:var(--card);box-shadow:inset 0 0 0 3px var(--ink)}
.log th,.log td{padding:7px 8px;text-align:left;border-bottom:2px solid var(--ink);white-space:nowrap}
.log th{background:var(--ink);color:var(--coin)}
.log td:nth-child(4){white-space:normal;min-width:96px}
.log tr.old{opacity:.5}
.empty{text-align:center;color:var(--muted);padding:24px 10px;font-weight:700}

/* game */
.gamebar{display:flex;align-items:center;gap:10px;padding:10px 4px}
.gamebar .x{border:0;background:var(--ink);color:#fff;font-weight:900;padding:6px 10px}
.hearts{display:flex;gap:3px}
.track{position:relative;height:86px;background:linear-gradient(var(--sky) 0 70%,transparent 70%);margin:0 4px;overflow:hidden;
  box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink)}
.track .ground{position:absolute;left:0;right:0;bottom:0}
.track .runner{position:absolute;bottom:24px;transition:left .5s steps(6)}
.track .flag{position:absolute;right:16px;bottom:26px;width:4px;height:52px;background:var(--ink)}
.track .flag::after{content:"";position:absolute;left:4px;top:2px;width:22px;height:14px;background:var(--good);box-shadow:inset -4px -4px 0 rgba(0,0,0,.2)}
.track .coinpop{position:absolute;bottom:64px;animation:pop .7s steps(5) forwards}
@keyframes pop{to{transform:translateY(-26px);opacity:0}}
.qcard{padding:16px;margin-top:14px}
.qnum{font-family:var(--px);font-size:10px;color:var(--muted);margin-bottom:8px}
.passage{background:var(--card);padding:12px;margin:0 0 12px;max-height:240px;overflow:auto;box-shadow:inset 0 0 0 3px var(--ink);font-size:15px;line-height:1.75}
.prompt{font-size:18px;font-weight:700;line-height:1.6;margin-bottom:12px}
.prompt.zh{font-size:20px}
.gap{display:inline-block;min-width:64px;border-bottom:3px solid var(--accent);margin:0 2px}
.blank{display:inline-block;background:var(--accent);color:#fff;font-weight:900;padding:0 6px;margin:0 2px}
.blank.cur{background:var(--heart)}
.w{cursor:pointer;border-radius:0}
.w:hover{background:rgba(46,111,216,.15)}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{text-align:left;border:0;padding:12px 14px;background:var(--card);font-size:16px;font-weight:700;margin:4px;
  box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset -4px -4px 0 0 rgba(0,0,0,.1)}
.opt .k{font-family:var(--px);font-size:11px;margin-right:10px;color:var(--muted)}
.opt.ok{background:var(--good);color:#fff}
.opt.no{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.shake{animation:shake .3s steps(4)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:14px;padding:12px;background:var(--card);box-shadow:inset 0 0 0 3px var(--ink)}
.fb .res{font-weight:900;font-size:17px}
.fb .res.ok{color:var(--good)} .fb .res.no{color:var(--bad)}
.fb p{margin:6px 0}
.tag{display:inline-block;font-size:12px;font-weight:900;background:var(--ink);color:var(--coin);padding:2px 8px;margin-right:6px}
.listen{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.script{font-size:15px;margin-top:8px}
.script b{font-family:var(--px);font-size:10px;margin-right:6px}
.hint{font-size:13px;color:var(--muted)}

/* overlays */
.sheet-bg{position:fixed;inset:0;background:rgba(14,14,28,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:82vh;overflow:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));margin:0;
  box-shadow:0 -4px 0 0 var(--ink)}
.sheet .close{float:right;border:0;background:var(--ink);color:#fff;font-weight:900;padding:4px 10px}
.loader{display:flex;align-items:center;gap:12px;padding:16px 0;font-weight:700}
.loader .runner{animation:run .5s steps(2) infinite}
@keyframes run{50%{transform:translateY(-5px)}}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:#FFF6DC;padding:10px 16px;font-weight:700;font-size:14px;max-width:90vw}
.result{text-align:center;padding:24px 16px}
.result .big{font-family:var(--px);font-size:18px;line-height:1.8;margin:8px 0}
.result .bigstars{display:flex;justify-content:center;gap:8px;margin:14px 0}
.fc{min-height:220px;display:grid;place-items:center;text-align:center;padding:20px;cursor:pointer}
.fc .front{font-size:28px;font-weight:900}
.fc .back{font-size:16px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hud">
  <span id="hudFox"></span>
  <span class="title">GEPT QUEST</span>
  <span class="streak" id="hudStreak"></span>
  <span class="stat"><span id="hudCoinIcon"></span><span id="hudCoins">0</span></span>
</header>
<main id="app"></main>
<nav class="nav" id="nav">
  <button data-go="map" aria-current="page"><svg viewBox="0 0 8 8" shape-rendering="crispEdges"><path fill="currentColor" d="M0 6h8v2H0zM1 3h2v3H1zM5 1h2v5H5zM6 0h1v1H6z"/></svg>闖關地圖</button>
  <button data-go="daily"><svg viewBox="0 0 8 8" shape-rendering="crispEdges"><path fill="currentColor" d="M0 1h8v7H0zM1 3v4h6V3zM2 0h1v2H2zM5 0h1v2H5zM2 4h2v2H2z"/></svg>今日進度</button>
  <button data-go="lookup"><svg viewBox="0 0 8 8" shape-rendering="crispEdges"><path fill="currentColor" d="M1 0h4v1H1zM0 1h1v4H0zM5 1h1v4H5zM1 5h4v1H1zM5 5h1v1H5zM6 6h1v1H6zM7 7h1v1H7z"/></svg>查詢</button>
  <button data-go="review"><svg viewBox="0 0 8 8" shape-rendering="crispEdges"><path fill="currentColor" d="M1 0h6v8H1zM2 1v5h4V1zM3 2h2v1H3zM3 4h2v1H3z"/></svg>複習本</button>
</nav>
<div id="overlay"></div>

<script>
/* ===================== pixel art ===================== */
const PAL={K:'#1B1B2F',Y:'#FFC93C',D:'#E09B12',L:'#FFF3B0',R:'#E5383B',O:'#F28C28',B:'#2E6FD8',W:'#FFF8EC',G:'#9A94AE',P:'#9C7BEA'};
function pix(rows,size,pal){pal=pal||PAL;const h=rows.length,w=rows[0].length;let r='';
  rows.forEach((row,y)=>[...row].forEach((c,x)=>{if(pal[c])r+=`<rect x="${x}" y="${y}" width="1.04" height="1.04" fill="${pal[c]}"/>`}));
  return `<svg viewBox="0 0 ${w} ${h}" width="${size}" height="${Math.round(size*h/w)}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`}
const FOX_A=["..K......K..",".KOK....KOK.",".KOOKKKKOOK.","KOOOOOOOOOOK","KOOKOOOOKOOK","KOWWOOOOWWOK",".KWWWKKWWWK.","..KWWWWWWK..",".KBBBBBBBBK.",".KOOBOOOOOK.",".KOOOOOOOOK.","..KK....KK.."];
const FOX_B=FOX_A.slice(0,11).concat([".KK......KK."]);
const COIN=["..KKKK..",".KYYYYK.","KYYLYYDK","KYYLYYDK","KYYLYYDK","KYYYYYDK",".KDDDDK.","..KKKK.."];
const HEART=[".RR.RR.","RRRRRRR","RRRRRRR",".RRRRR.","..RRR..","...R..."];
const HEART_E=HEART.map(r=>r.replace(/R/g,'G'));
const STAR=["...Y...","...Y...","YYYYYYY",".YYYYY.","..YYY..",".YY.YY.","Y.....Y"];
const STAR_E=STAR.map(r=>r.replace(/Y/g,'G'));
const fox=s=>pix(FOX_A,s), coin=s=>pix(COIN,s), heart=(s,on=true)=>pix(on?HEART:HEART_E,s), star=(s,on=true)=>pix(on?STAR:STAR_E,s);

/* ===================== question bank ===================== */
/* options: first one is correct; shuffled when played */
const V=[
['The museum is so popular that you have to make a ___ two weeks ahead.','reservation|reaction|reputation|relation','reservation 預約。make a reservation 是「訂位、預約」的固定用法。'],
['Mia was ___ to find that her lost wallet had been returned with all the money inside.','relieved|ashamed|annoyed|bored','relieved 鬆了一口氣的。錢包找回來，心情是放心、鬆一口氣。'],
['Please ___ the form carefully before you hand it in.','complete|compete|complain|compare','complete 填寫完成。compete 競爭、complain 抱怨、compare 比較。'],
['The new park will ___ people in the neighborhood with a place to exercise.','provide|prevent|protect|promote','provide A with B：提供 A 某物 B。'],
['Because of the heavy rain, the baseball game was ___ until next Sunday.','postponed|produced|proposed|punished','postpone 延期。下大雨所以比賽延到下週日。'],
['It is ___ to drink enough water every day, especially in summer.','essential|elegant|emotional|electric','essential 必要的、非常重要的。'],
['The teacher asked us to ___ the main idea of the article in one sentence.','summarize|memorize|organize|apologize','summarize 摘要。用一句話說出大意就是摘要。'],
['My grandmother lives alone, so we visit her ___ to make sure she is fine.','regularly|rarely|recently|roughly','regularly 定期地。rarely 很少（意思相反）。'],

  const chunkN=(arr,n)=>{const o=[];for(let i=0;i<arr.length;i+=n)o.push(arr.slice(i,i+n));return o};
  const chunk=(arr,n)=>[arr.slice(0,n),arr.slice(n,2*n),arr.slice(2*n,3*n)];
  chunk(V,5).forEach((c,i)=>STAGES['1-'+(i+1)]={world:1,items:c.map(x=>mc(x[0],x[1],x[2]))});
  chunkN(GR,5).forEach((c,i)=>STAGES['2-'+(i+1)]={world:2,items:c.map(x=>mc(x[0],x[1],x[2],x[3]))});
  CLOZE.forEach((p,i)=>STAGES['3-'+(i+1)]={world:3,title:p.title,passage:p.passage,items:p.items.map((x,k)=>{const it=mc(`第 [${k+1}] 格應該填入哪一個？`,x[0],x[1],x[2]);it.blank=k+1;return it})});
  READ.forEach((p,i)=>STAGES['4-'+(i+1)]={world:4,title:p.title,passage:p.passage,items:p.items.map(x=>mc(x[0],x[1],x[2]))});
  chunk(LISTEN,4).forEach((c,i)=>STAGES['5-'+(i+1)]={world:5,items:c.map(x=>({kind:'listen',sub:x.kind,lines:x.lines.map(l=>({s:l[0],t:l[1]})),question:x.q||'',options:x.o.split('|'),explain:x.e}))});
  chunk(TRANS,3).forEach((c,i)=>STAGES['6-'+(i+1)]={world:6,items:c.map(x=>({kind:'translate',zh:x[0],answer:x[1],tag:x[2]}))});
})();

function defaultState(){return {coins:0,best:{},days:{},goal:3,items:[],mistakes:[],recent:[],wl:{},updatedAt:0}}
function tomb(id){const s=S();s.del=s.del||[];s.del.push(id);if(s.del.length>800)s.del=s.del.slice(-800)}
function mergeStates(a,b){if(!a||!a.updatedAt)return b;if(!b||!b.updatedAt)return a;
  const [n,o]=(a.updatedAt>=b.updatedAt)?[a,b]:[b,a];const m=JSON.parse(JSON.stringify(n));
  const del=new Set([...(n.del||[]),...(o.del||[])]);m.del=[...del].slice(-800);
  for(const k of ['items','mistakes','payouts']){m[k]=m[k]||[];const ids=new Set(m[k].map(x=>x.id));for(const x of (o[k]||[]))if(x&&x.id&&!ids.has(x.id))m[k].push(x);m[k]=m[k].filter(x=>!del.has(x.id))}
  m.payouts.sort((x,y)=>String(y.at).localeCompare(String(x.at)));
  m.days=m.days||{};for(const k in (o.days||{})){const x=o.days[k],y=m.days[k];if(!y){m.days[k]=x;continue}
    const r=JSON.parse(JSON.stringify((x.q||0)>(y.q||0)?x:y));r.types=[...new Set([...(y.types||[]),...(x.types||[])])];
    for(const f of ['earn','credited','stages','words'])r[f]=Math.max(x[f]||0,y[f]||0);r.newWords=y.newWords||x.newWords;m.days[k]=r}
  m.best=m.best||{};for(const k in (o.best||{}))m.best[k]=Math.max(m.best[k]||0,o.best[k]||0);
  m.wl=m.wl||{};for(const k in (o.wl||{}))if((o.wl[k]||0)>(m.wl[k]||0))m.wl[k]=o.wl[k];
  const pa=n.period,pb=o.period;if(pa&&pb){if((pb.ver||0)>(pa.ver||0)||((pb.ver||0)===(pa.ver||0)&&pb.start===pa.start&&pb.earned>pa.earned))m.period=JSON.parse(JSON.stringify(pb))}else m.period=pa||pb;
  m.coins=Math.max(n.coins||0,o.coins||0);if(!m.pin&&o.pin)m.pin=o.pin;m.v3=n.v3||o.v3;
  return m}
const Store={state:defaultState(),ref:null,saving:false,pending:false,timer:null,syncedAt:0,
  async init(){
    try{const raw=localStorage.getItem(LS_KEY);if(raw)this.state=Object.assign(defaultState(),JSON.parse(raw))}catch(e){}
    if(!(window.claude&&window.claude.use))return;
    try{
      const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      if(!db||!user)return;
      const id=await user.id(); if(!id)return;
      this.ref=db.collection('data/users/'+id).doc('practice');
      await this.pull();
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')this.pull()});
      setInterval(()=>{if(document.visibilityState==='visible')this.pull()},60000);
    }catch(e){this.ref=null}
    if(!G&&!$('#overlay').innerHTML)render();
  },
  async pull(){if(!this.ref||this.saving)return;
    try{const snap=await this.ref.get();
      if(!snap.exists){if(this.state.updatedAt)await this.flush();else this.syncedAt=Date.now();return}
      const remote=JSON.parse(JSON.stringify(snap.data()));const merged=mergeStates(this.state,remote);
      const changed=JSON.stringify(merged)!==JSON.stringify(this.state);this.state=Object.assign(defaultState(),merged);this.syncedAt=Date.now();
      try{localStorage.setItem(LS_KEY,JSON.stringify(this.state))}catch(e){}
      if(JSON.stringify(merged)!==JSON.stringify(remote))this.flush();
      if(changed){if(!G&&!$('#overlay').innerHTML)render();else updateHud()}
    }catch(e){}},
  save(){this.state.updatedAt=Date.now();
    try{localStorage.setItem(LS_KEY,JSON.stringify(this.state))}catch(e){}
    clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),1200);updateHud()},
  async flush(){if(!this.ref)return;if(this.saving){this.pending=true;return}
    this.saving=true;try{const snap=await this.ref.get();if(snap.exists)this.state=Object.assign(defaultState(),mergeStates(this.state,JSON.parse(JSON.stringify(snap.data()))));
      await this.ref.set(JSON.parse(JSON.stringify(this.state)));this.syncedAt=Date.now();try{localStorage.setItem(LS_KEY,JSON.stringify(this.state))}catch(e){}}catch(e){}
    this.saving=false;if(this.pending){this.pending=false;this.flush()}}
};
function S(){const s=Store.state;if(!s.period){s.period={start:today(),earned:0};s.coins=0}if(!s.payouts)s.payouts=[];if(!s.rules)s.rules={day:4,month:100};if(!s.v3){for(const k in s.days){const d=s.days[k];d.credited=d.earn||0;d.types=d.types||[]}s.v3=1}return s}
function dayRec(d){const s=S();if(!s.days[d])s.days[d]={q:0,c:0,stages:0};return s.days[d]}
function streak(){const s=S();let n=0;const d=new Date();
  if(!((s.days[today()]||{}).stages>=s.goal))d.setDate(d.getDate()-1);
  while(true){const k=d.toLocaleDateString('sv-SE');if((s.days[k]||{}).stages>=s.goal){n++;d.setDate(d.getDate()-1)}else break}
  return n}

  const room=Math.max(0,s.rules.day-d.earn);const add=r2(Math.min(x,room));
  if(add<r2(x)&&G)G.capped=true;

function dayTarget(d){const n=(d.types||[]).length;if(n<2)return 0;return r2((d.earn||0)*(n>=4?1.2:1))}
function settleDay(d){const s=S();if(d.credited===undefined)d.credited=0;
  const target=dayTarget(d);if(target<=d.credited)return;
  const room=Math.max(0,s.rules.month-s.period.earned);const inc=r2(Math.min(target-d.credited,room));if(inc<=0)return;
  d.credited=r2(d.credited+inc);s.period.earned=r2(s.period.earned+inc);s.coins=r2((s.coins||0)+inc)}

  else{const e=s.period.earned;inner=`<h2>家長結算</h2>
    <p style="margin:0">期間：${s.period.start} ～ ${today()}</p><p style="font-size:22px;font-weight:900;margin:4px 0 10px">累積 NT$${money(e)}</p>

    <h3>設定</h3>
    <div class="row"><label class="hint" for="dayCap">每天上限</label><input type="text" inputmode="decimal" id="dayCap" value="${s.rules.day}" style="width:90px"><label class="hint" for="monCap">每期上限</label><input type="text" inputmode="decimal" id="monCap" value="${s.rules.month}" style="width:90px"></div>
    <div class="row" style="margin-top:8px"><span class="hint">每日目標</span>${[1,2,3,4,5].map(n=>`<button class="chip" data-goal="${n}" aria-pressed="${s.goal===n}">${n} 關</button>`).join('')}</div>
    <div class="row" style="margin-top:8px"><button class="btn small" data-act="saveRules">儲存上限</button>${''}<button class="btn small ghost" data-act="resetPin">變更密碼</button></div>
    ${s.payouts.length?`<h3>領取紀錄</h3><p class="hint" style="margin:0 0 4px">按錯或測試的紀錄可以刪除。</p>${s.payouts.map(p=>`<div class="item" style="display:flex;align-items:center;gap:8px"><div style="flex:1"><div style="font-weight:900">實付 NT$${p.paid}</div><div class="meta">${p.at} 結算・累積 $${money(p.earned)}${p.note?'・'+esc(p.note):''}</div></div><button class="btn small ghost" data-delpay="${p.id}">刪除</button></div>`).join('')}`:''}`}
  $('#overlay').innerHTML=`<div class="sheet-bg" data-act="closeSheet"><div class="px sheet" role="dialog" aria-label="家長結算"><button class="close" data-act="closeSheet">關閉</button>${msg?`<p style="color:var(--bad);font-weight:900">${esc(msg)}</p>`:''}${inner}</div></div>`}
function renderDaily(){const s=S(),d=dayRec(today()),pct=Math.min(100,Math.round(d.stages/s.goal*100));
  const acc=d.q?Math.round(d.c/d.q*100):0;const mc2=masteredCount();const weak=s.items.filter(i=>i.fam===0).length;

   </div>
   <h3>今日新字</h3><p class="lead" style="margin:0 0 6px">每天 10 個官方字表的中級字，${d.words?'今天已完成 ✔':'今天還沒完成'}。中級字已掌握 ${mc2.i} / ${DICT_COUNT.i}，初級字 ${mc2.e} / ${DICT_COUNT.e}（同一個字答對 2 次算掌握）。</p>
   <div class="row"><button class="btn blue" data-stage="7-today">看今日新字</button></div>

/* ===================== lookup ===================== */
let lookupKind='word', lookupResult=null, lookupBusy=false;
function renderLookup(){const s=S();
  return `<div class="view"><div class="px panel">
   <h2>查詢單字或文法</h2><p class="lead">輸入英文單字、片語，或想問的文法（例如「現在完成式」「used to」）。查到的可以直接存進複習本。</p>
   <div class="seg" role="group" aria-label="查詢類型"><button data-kind="word" aria-pressed="${lookupKind==='word'}">單字 / 片語</button><button data-kind="grammar" aria-pressed="${lookupKind==='grammar'}">文法</button></div>
   <div class="row" style="margin-top:10px;flex-wrap:nowrap"><input type="search" id="q" placeholder="${lookupKind==='word'?'例如 postpone':'例如 被動語態'}" autocomplete="off" enterkeyhint="search"><button class="btn" data-act="doLookup">查詢</button></div>
   <div id="lookupOut">${lookupBusy?loaderHtml('查詢中…'):(lookupResult?resultCard(lookupResult):'')}</div>
   ${s.recent.length?`<h3>最近查過</h3><div class="chips">${s.recent.map(r=>`<button class="chip" data-recent="${esc(r.term)}" data-rk="${r.kind}">${esc(r.term)}</button>`).join('')}</div>`:''}
  </div></div>`}
function loaderHtml(t){return `<div class="loader"><span class="runner">${fox(28)}</span>${esc(t)}</div>`}
function resultCard(r){
  if(r.manual)return `<div class="item"><div class="t">${esc(r.term)}</div><p class="hint">${esc(r.note||'目前查不到這個詞的解釋。你可以自己填中文意思再存起來。')}</p>
    <input type="text" id="manualZh" placeholder="中文意思（例如：延期）"><div class="row" style="margin-top:8px"><button class="btn" data-act="saveManual">存進複習本</button>${r.kind==='word'?`<a class="btn ghost small" style="text-decoration:none" href="https://dictionary.cambridge.org/zht/%E8%A9%9E%E5%85%B8/%E8%8B%B1%E8%AA%9E-%E6%BC%A2%E8%AA%9E-%E7%B9%81%E9%AB%94/${encodeURIComponent(r.term)}" target="_blank" rel="noopener">到劍橋字典查</a>`:''}</div></div>`;
  const saved=findItem(r.term,r.kind);
  if(r.kind==='grammar')return `<div class="item"><div class="t">${esc(r.term)}</div>
    <p class="zh">${esc(r.zh)}</p>${r.pattern?`<p><span class="tag">句型</span>${esc(r.pattern)}</p>`:''}
    ${r.example?`<p class="ex">${esc(r.example)}</p><p class="meta">${esc(r.exampleZh)}</p>`:''}${r.tip?`<p class="meta">提醒：${esc(r.tip)}</p>`:''}
    <div class="row"><button class="btn" data-act="saveResult" ${saved?'disabled':''}>${saved?'已在複習本':'存進文法本'}</button></div></div>`;
  return `<div class="item"><div class="t">${esc(r.term)} <span class="meta">${esc(r.kk||'')}</span></div>
   <div class="meta">${esc(r.pos||'')} ${r.level?'· '+esc(r.level):''}</div><p class="zh" style="font-weight:700">${esc(r.zh)}</p>
   ${r.example?`<p class="ex">${esc(r.example)}</p><p class="meta">${esc(r.exampleZh||'')}</p>`:''}${r.related?`<p class="meta">相關：${esc(r.related)}</p>`:''}
   <div class="row"><button class="btn" data-act="saveResult" ${saved?'disabled':''}>${saved?'已在複習本':'存進單字本'}</button>
   <button class="btn ghost small" data-act="sayTerm">🔊 發音</button></div></div>`}
function findItem(term,kind){return S().items.find(i=>i.type===kind&&i.term.toLowerCase()===String(term).toLowerCase())}
async function lookup(term,kind){term=term.trim();if(!term)return null;
  const s=S();s.recent=[{term,kind}].concat(s.recent.filter(r=>!(r.term.toLowerCase()===term.toLowerCase()&&r.kind===kind))).slice(0,10);Store.save();
  if(kind==='word'){const hit=dictFind(term);
    if(hit){const r={kind:'word',term:hit.w,pos:hit.pos,zh:hit.zh,level:'全民英檢'+(hit.lv?'中級':'初級')+'字'};
      try{const ai=await ask(`請為英文單字「${hit.w}」提供 KK 音標和一個國中生看得懂的英文例句。只用 JSON 回覆，不要其他文字：{"kk":"KK音標","example":"英文例句","exampleZh":"例句中文翻譯"}`);Object.assign(r,{kk:ai.kk||'',example:ai.example||'',exampleZh:ai.exampleZh||''})}catch(e){}
      return r}}
  try{
    if(kind==='grammar'){const r=await ask(`你是給台灣國三學生的英文小老師，用繁體中文、白話、少用術語。請解釋這個英文文法：「${term}」。只用 JSON 回覆，不要其他文字：{"term":"文法名稱（繁體中文，可附英文）","zh":"兩三句白話解釋什麼時候用","pattern":"句型公式","example":"一個簡單英文例句","exampleZh":"例句中文翻譯","tip":"國中生常犯的錯誤一句話"}`);
      return Object.assign({kind:'grammar',term},r)}
    const r=await ask(`你是給台灣國三學生的英文小老師。請查詢英文單字或片語「${term}」（若是變化形，請給原形）。若輸入是中文，請給最適合的英文單字。只用 JSON 回覆，不要其他文字：{"term":"英文原形","kk":"KK音標","pos":"詞性縮寫如 n. / v. / adj.","zh":"常用中文意思，多個用；分隔","level":"全民英檢初級／中級／中高級","example":"一個國中生看得懂的英文例句","exampleZh":"例句中文翻譯","related":"一兩個相關片語或同義字"}`);
    return Object.assign({kind:'word',term},r);
  }catch(e){
    if(kind==='word'){const w=term.toLowerCase().replace(/’/g,"'");const base=[w,w.replace(/s$/,''),w.replace(/es$/,''),w.replace(/ed$/,''),w.replace(/d$/,''),w.replace(/ing$/,''),w.replace(/ing$/,'e'),w.replace(/ied$/,'y')].find(x=>GLOSS[x]);
      if(base)return {kind:'word',term:base,pos:GLOSS[base].pos,zh:GLOSS[base].zh,offline:true}}
    return {kind,term,manual:true,note:kind==='word'&&/[\u4e00-\u9fff]/.test(term)?'字表裡找不到中文意思有「'+term+'」的字，換個說法試試（例如把「延期」改成「延遲」）。':kind==='word'?'官方字表裡沒有這個字（可能是人名、地名，或比較少見的字）。可以自己填中文意思再存，或到劍橋字典查。':''}
  }}
function saveResult(r,source){if(!r||findItem(r.term,r.kind))return;
  S().items.unshift({id:uid(),type:r.kind,term:r.term,zh:r.zh||'',pos:r.pos||'',kk:r.kk||'',pattern:r.pattern||'',example:r.example||'',exampleZh:r.exampleZh||'',fam:0,added:Date.now(),source:source||'查詢'});
  Store.save();toast(`已存進${r.kind==='grammar'?'文法本':'單字本'}`)}

/* lookup sheet (used inside questions) */
let sheetResult=null;
async function openSheet(term,kind){sheetResult=null;
  $('#overlay').innerHTML=`<div class="sheet-bg" data-act="closeSheet"><div class="px sheet" role="dialog" aria-label="查詢結果"><button class="close" data-act="closeSheet">關閉</button><div id="sheetBody">${loaderHtml('查詢「'+term+'」…')}</div></div></div>`;
  sheetResult=await lookup(term,kind);if(!$('#sheetBody'))return;$('#sheetBody').innerHTML=resultCard(sheetResult).replace(/data-act="saveResult"/,'data-act="saveSheet"').replace(/data-act="saveManual"/,'data-act="saveSheetManual"')}

let rv={tab:'word',fam:'all',q:''};
function renderReview(){const s=S();
  let list=rv.tab==='mistake'?s.mistakes:s.items.filter(i=>i.type===rv.tab);

  const head=`<div class="view"><div class="px panel"><h2>複習本</h2><p class="lead">查過、存下的單字和文法都在這裡，答錯的題目會自動收進錯題本。</p>
   <div class="seg" role="group" aria-label="分類"><button data-tab="word" aria-pressed="${rv.tab==='word'}">單字（${s.items.filter(i=>i.type==='word').length}）</button><button data-tab="grammar" aria-pressed="${rv.tab==='grammar'}">文法（${s.items.filter(i=>i.type==='grammar').length}）</button><button data-tab="mistake" aria-pressed="${rv.tab==='mistake'}">錯題（${s.mistakes.length}）</button></div>
   <input type="search" id="rq" value="${esc(rv.q)}" placeholder="搜尋英文、中文或文法名稱" style="margin-top:10px" autocomplete="off">
   ${rv.tab!=='mistake'?`<div class="chips">${[['all','全部'],['0','不熟'],['1','普通'],['2','熟']].map(([k,l])=>`<button class="chip" data-fam="${k}" aria-pressed="${rv.fam===k}">${l}</button>`).join('')}</div>`:''}
   <div class="row" style="margin-top:6px">${rv.tab!=='mistake'?`<button class="btn" data-act="flash" ${list.length?'':'disabled'}>翻卡複習（${list.length}）</button>`:''}
   ${rv.tab==='word'?`<button class="btn blue" data-act="wordQuiz" ${list.filter(i=>i.zh).length>=4?'':'disabled'}>單字小測驗</button>`:''}
   ${rv.tab==='mistake'?`<button class="btn" data-act="retryMistakes" ${s.mistakes.some(m=>m.options)?'':'disabled'}>重練錯題</button>`:''}</div>
   ${rv.tab==='word'&&list.filter(i=>i.zh).length<4?'<p class="hint">存滿 4 個有中文意思的單字，就能玩單字小測驗。</p>':''}</div>`;
  let body='';
  if(!list.length)body=`<div class="px panel empty">${rv.tab==='mistake'?'還沒有錯題。去闖關吧！':(rv.q||rv.fam!=='all'?'找不到符合的項目，換個條件試試。':'還沒有存東西。闖關時點題目裡的英文字，或到「查詢」頁查完按儲存。')}</div>`;
  else if(rv.tab==='mistake')body=list.map(m=>`<div class="item">${m.tag?`<span class="tag">${esc(m.tag)}</span>`:''}<p style="font-weight:700;margin:6px 0">${words(m.prompt)}</p>
     <p class="meta">你的答案：${esc(m.your)}</p><p style="color:var(--good);font-weight:900;margin:2px 0">正解：${esc(m.answer)}</p><p class="meta">${esc(m.explain||'')}</p>
     <div class="row">${m.tag?`<button class="btn small ghost" data-look="${esc(m.tag)}" data-lk="grammar">查這個文法</button>`:''}<button class="btn small ghost" data-delmistake="${m.id}">移除</button></div></div>`).join('');
  else body=list.map(i=>`<div class="item"><div class="t">${esc(i.term)} <span class="meta">${esc(i.kk||'')} ${esc(i.pos||'')}</span></div>
     <p class="zh">${esc(i.zh)}</p>${i.pattern?`<p class="meta">句型：${esc(i.pattern)}</p>`:''}${i.example?`<p class="ex">${esc(i.example)}</p>`:''}
     <div class="fam" role="group" aria-label="熟悉度">${['不熟','普通','熟'].map((l,n)=>`<button class="f${n}" data-setfam="${i.id}" data-v="${n}" aria-pressed="${i.fam===n}">${l}</button>`).join('')}
     <button data-delitem="${i.id}" style="margin-left:auto">刪除</button></div></div>`).join('');
  return head+`<div class="px" style="padding:4px 4px 8px;margin-top:16px">${body}</div></div>`}

/* flashcards */

    ${it.type==='word'?`<div class="row" style="justify-content:center"><button class="btn ghost small" data-say="${esc(it.term)}" aria-label="播放 ${esc(it.term)} 的發音">🔊 發音</button><button class="btn ghost small" data-act="fcExample">📖 例句</button></div>`:''}

  const pool=QUIZ_LIST.filter(x=>x.w!==e.w&&x.lv===e.lv&&posKey(x)===posKey(e)&&shortZh(x)!==shortZh(e));
  const ds=pickWords(pool.length>=3?pool:QUIZ_LIST.filter(x=>x.w!==e.w),3,Math.random);
  const ex=`${e.w}（${e.pos}）：${e.zh}。全民英檢${e.lv?'中級':'初級'}字。`;
  const it=i%2===0?mc(`“${e.w}” 的中文意思是？`,[shortZh(e)].concat(ds.map(shortZh)).join('|'),ex):mc(`「${shortZh(e)}」的英文是哪一個？`,[e.w].concat(ds.map(d=>d.w)).join('|'),ex);
  it.dictWord=e.w;return it})}
function startWordStage(id){const s=S();s.wl=s.wl||{};let list;
  if(id==='7-weak'){list=s.items.filter(i=>i.type==='word'&&i.fam===0).map(i=>dictFind(i.term)).filter(Boolean);
    if(!list.length){toast('目前沒有「不熟」的字。字表闖關答錯的字會自動加進來喔！');return}list=shuffle(list).slice(0,10)}
  else if(id==='7-today')list=getTodayList();
  else{const lv=id==='7-e'?0:1;const all=QUIZ_LIST.filter(e=>e.lv===lv);const pool=all.filter(e=>!(s.wl[e.w]>=2));list=pickWords(pool.length>=10?pool:all,10,Math.random)}
  $('#overlay').innerHTML='';startStage(id,{world:7,items:makeWordQs(list),hearts:5})}
function openTodaySheet(){const list=getTodayList();
  $('#overlay').innerHTML=`<div class="sheet-bg" data-act="closeSheet"><div class="px sheet" role="dialog" aria-label="今日新字"><button class="close" data-act="closeSheet">關閉</button><h2 style="margin:0 0 4px">今日新字</h2><p class="lead">先看一遍這 10 個中級字，再開始測驗。點 🔊 聽發音，點字可以存進單字本。</p>
  ${list.map(e=>`<div class="item" style="display:flex;gap:10px;align-items:center"><button class="btn ghost small" data-say="${esc(e.w)}" aria-label="播放 ${esc(e.w)} 的發音">🔊</button><div><div class="t"><span class="w" role="button" tabindex="0" data-w="${esc(e.w)}">${esc(e.w)}</span> <span class="meta">${esc(e.pos)}</span></div><div class="zh">${esc(e.zh)}</div></div></div>`).join('')}
  <div class="row"><button class="btn" data-act="startToday">開始測驗（10 題）</button></div></div></div>`}
function startWordQuiz(){const pool=S().items.filter(i=>i.type==='word'&&i.zh);const list=rv.fam==='all'?pool:pool.filter(i=>i.fam===+rv.fam);const src=(list.length>=4?list:pool);
  const qs=shuffle(src).slice(0,10).map(w=>{const others=shuffle(pool.filter(x=>x.id!==w.id)).slice(0,3).map(x=>x.zh);return Object.assign(mc(`“${w.term}” 是什麼意思？`,[w.zh].concat(others).join('|'),w.example?`例句：${w.example}`:''),{itemId:w.id})});
  startStage('review',{world:0,items:qs})}
function startMistakes(){const ms=S().mistakes.filter(m=>m.options&&m.options.length===4).slice(0,10);if(!ms.length){toast('目前沒有可以重練的選擇題錯題');return}
  startStage('mistakes',{world:0,items:ms.map(m=>Object.assign(mc(m.prompt,m.options.join('|'),m.explain,m.tag),{mistakeId:m.id}))})}

/* ===================== events ===================== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-delpay],[data-say],[data-go],[data-stage],[data-act],[data-pick],[data-kind],[data-recent],[data-tab],[data-fam],[data-setfam],[data-delitem],[data-delmistake],[data-goal],[data-rate],[data-self],[data-savegrammar],[data-look],.w');
  if(!t)return;const s=S();
  if(t.dataset.delpay){if(!parentOK)return;pendingDel=t.dataset.delpay;openParent();return}
  if(t.dataset.say){speak([{s:'N',t:t.dataset.say}],0.85);return}
  if(t.classList.contains('w')){openSheet(t.dataset.w,'word');return}
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.stage){const id=t.dataset.stage;if(t.getAttribute('aria-disabled')==='true'){toast(id.endsWith('ai')?'先打倒這座世界的魔王關':'先通過前一關才能解鎖');return}
    if(id.startsWith('7-')){id==='7-today'?openTodaySheet():startWordStage(id);return}
    if(id.endsWith('-ai'))startAI(+id.split('-')[0]);else startStage(id);return}
  if(t.dataset.pick!==undefined){pick(+t.dataset.pick);return}
  if(t.dataset.kind){lookupKind=t.dataset.kind;lookupResult=null;render();return}
  if(t.dataset.recent){lookupKind=t.dataset.rk;runLookup(t.dataset.recent);return}
  if(t.dataset.tab){rv.tab=t.dataset.tab;render();return}
  if(t.dataset.fam){rv.fam=t.dataset.fam;render();return}
  if(t.dataset.setfam){const i=s.items.find(x=>x.id===t.dataset.setfam);if(i){i.fam=+t.dataset.v;Store.save();render()}return}
  if(t.dataset.delitem){tomb(t.dataset.delitem);s.items=s.items.filter(x=>x.id!==t.dataset.delitem);Store.save();render();return}
  if(t.dataset.delmistake){tomb(t.dataset.delmistake);s.mistakes=s.mistakes.filter(x=>x.id!==t.dataset.delmistake);Store.save();render();return}
  if(t.dataset.goal){if(!parentOK)return;s.goal=+t.dataset.goal;Store.save();render();openParent();return}
  if(t.dataset.rate&&FC){const it=FC.list[FC.i];const real=s.items.find(x=>x.id===it.id);if(real)real.fam=+t.dataset.rate;FC.count[+t.dataset.rate]++;FC.i++;FC.flip=false;FC.showEx=false;Store.save();drawFlash();return}
  if(t.dataset.self!==undefined){selfCheck(t.dataset.self==='1');return}
  if(t.dataset.savegrammar){const tag=t.dataset.savegrammar;if(findItem(tag,'grammar'))return;openSheet(tag,'grammar');return}
  if(t.dataset.look){openSheet(t.dataset.look,t.dataset.lk||'word');return}
  const a=t.dataset.act;
  if(a==='closeSheet'){if(e.target!==t&&t.classList.contains('sheet-bg'))return;$('#overlay').innerHTML='';parentOK=false;pendingPay=null;pendingUndo=false;pendingDel=null;if(G)render();return}
  if(a==='saveSheet'){saveResult(sheetResult,G?stageName():'查詢');t.disabled=true;t.textContent='已存起來';return}
  if(a==='saveSheetManual'){const zh=($('#manualZh').value||'').trim();if(!zh){toast('先填中文意思');return}saveResult({kind:sheetResult.kind,term:sheetResult.term,zh},G?stageName():'查詢');$('#overlay').innerHTML='';return}
  if(a==='doLookup'){runLookup($('#q').value);return}
  if(a==='saveResult'){saveResult(lookupResult);render();return}
  if(a==='saveManual'){const zh=($('#manualZh').value||'').trim();if(!zh){toast('先填中文意思');return}saveResult({kind:lookupResult.kind,term:lookupResult.term,zh});lookupResult=null;render();return}
  if(a==='sayTerm'){const r=($('#sheetBody')&&sheetResult)?sheetResult:lookupResult;if(r)speak([{s:'N',t:r.term}],0.85);return}
  if(a==='play'){const it=G.items[G.i];speak(it.lines.concat(it.question?[{s:'N',t:'Question: '+it.question}]:[]),+t.dataset.rate);return}
  if(a==='showScript'){G.showScript=!G.showScript;render();return}
  if(a==='submitTr'){submitTr();return}
  if(a==='next'){nextQ();return}
  if(a==='quit'){$('#overlay').innerHTML=`<div class="sheet-bg" data-act="closeSheet"><div class="px sheet" role="dialog" aria-label="離開關卡"><h2 style="margin:0 0 6px">確定要離開這一關嗎？</h2><p class="lead">這關的進度不會保留，但已經賺到的零用金會留著。</p><div class="row"><button class="btn" data-act="quitYes">離開</button><button class="btn ghost" data-act="closeSheet">繼續作答</button></div></div></div>`;return}
  if(a==='quitYes'){$('#overlay').innerHTML='';go(view);return}
  if(a==='startToday'){startWordStage('7-today');return}
  if(a==='parent'){parentOK=false;openParent();Store.pull();return}
  if(a==='setPin'){const p1=$('#pin1').value,p2=$('#pin2').value;if(!/^\d{4}$/.test(p1))return openParent('請輸入 4 位數字');if(p1!==p2)return openParent('兩次輸入的密碼不一樣');s.pin=hashStr('pin:'+p1);Store.save();parentOK=true;openParent();return}
  if(a==='checkPin'){if(hashStr('pin:'+$('#pinIn').value)===s.pin){parentOK=true;openParent()}else openParent('密碼不對');return}
  if(a==='settle'){if(!parentOK)return;const paid=parseFloat($('#paidIn').value);if(!(paid>=0))return openParent('請輸入正確的金額');pendingPay={paid:r2(paid),note:($('#noteIn').value||'').trim()};openParent();return}
  if(a==='delNo'){pendingDel=null;openParent();return}
  if(a==='delBack'){if(!parentOK)return;const p=s.payouts[0];if(!p||p.id!==pendingDel)return;tomb(p.id);s.payouts.shift();s.period={start:p.from,earned:r2(p.earned+s.period.earned),ver:(s.period.ver||0)+1};pendingDel=null;Store.save();render();openParent();toast('已刪除，金額已加回本期');return}
  if(a==='delOnly'){if(!parentOK)return;tomb(pendingDel);s.payouts=s.payouts.filter(x=>x.id!==pendingDel);pendingDel=null;Store.save();render();openParent();toast('已刪除紀錄');return}
  if(a==='settleNo'){pendingPay=null;openParent();return}
  if(a==='settleYes'){if(!parentOK||!pendingPay)return;const pp=pendingPay;pendingPay=null;t.disabled=true;t.textContent='同步中…';
    Store.pull().then(()=>{const s=S();s.payouts.unshift({id:uid(),at:today(),from:s.period.start,to:today(),earned:s.period.earned,paid:pp.paid,note:pp.note});s.period={start:today(),earned:0,ver:(s.period.ver||0)+1};Store.save();$('#overlay').innerHTML='';parentOK=false;render();toast('已結算，從今天重新累積')});return}
  if(a==='saveRules'){if(!parentOK)return;const dc=parseFloat($('#dayCap').value),mc=parseFloat($('#monCap').value);if(!(dc>0&&mc>0))return openParent('上限要大於 0');s.rules={day:r2(dc),month:r2(mc)};Store.save();render();openParent();toast('設定已儲存');return}
  if(a==='undoPay'){if(!parentOK||!s.payouts[0])return;pendingUndo=true;openParent();return}
  if(a==='undoNo'){pendingUndo=false;openParent();return}
  if(a==='undoYes'){if(!parentOK||!pendingUndo)return;pendingUndo=false;const p=s.payouts[0];if(!p)return;tomb(p.id);s.payouts.shift();s.period={start:p.from,earned:r2(p.earned+s.period.earned),ver:(s.period.ver||0)+1};Store.save();render();openParent();return}
  if(a==='resetPin'){if(!parentOK)return;s.pin=null;parentOK=false;Store.save();openParent();return}
  if(a==='again'){const id=G.id;if(id.startsWith('7-')){startWordStage(id);return}if(id.endsWith('-ai')){startAI(G.world);return}if(id==='review'){startWordQuiz();return}if(id==='mistakes'){startMistakes();return}startStage(id);return}
  if(a==='toMap'){go(G&&(G.id==='review'||G.id==='mistakes')?'review':'map');return}
  if(a==='studyWeak'){rv={tab:'word',fam:'0',q:''};const list=s.items.filter(i=>i.fam===0);go('review');startFlash(list);return}
  if(a==='retryMistakes'){startMistakes();return}
  if(a==='flash'){let list=s.items.filter(i=>i.type===rv.tab);if(rv.fam!=='all')list=list.filter(i=>i.fam===+rv.fam);if(rv.q){const q=rv.q.toLowerCase();list=list.filter(i=>(i.term+i.zh).toLowerCase().includes(q))}startFlash(list);return}
  if(a==='flipCard'&&FC){FC.flip=!FC.flip;drawFlash();return}
  if(a==='fcExample'&&FC){const it=FC.list[FC.i];FC.showEx=true;
    if(!it.example&&aiAvail){FC.loadingEx=true;drawFlash();
      ask(`請為英文單字「${it.term}」（意思：${it.zh}）寫一個國中生看得懂的英文例句。只用 JSON 回覆，不要其他文字：{"example":"英文例句","exampleZh":"例句中文翻譯"}`).then(r=>{if(r&&r.example){it.example=r.example;it.exampleZh=r.exampleZh||'';const real=s.items.find(x=>x.id===it.id);if(real){real.example=it.example;real.exampleZh=it.exampleZh;Store.save()}}}).catch(()=>{}).finally(()=>{if(FC){FC.loadingEx=false;drawFlash()}});return}
    drawFlash();return}
  if(a==='closeFlash'){FC=null;$('#overlay').innerHTML='';render();return}
  if(a==='wordQuiz'){startWordQuiz();return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='q'){runLookup(e.target.value)}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&(e.target.classList.contains('w')||e.target.dataset.act==='flipCard')){e.preventDefault();e.target.click()}
  if(e.key==='Escape'&&$('#overlay').innerHTML){FC=null;$('#overlay').innerHTML='';render()}
});
document.addEventListener('input',e=>{if(e.target.id==='rq'){rv.q=e.target.value;const pos=e.target.selectionStart;render();const el=$('#rq');if(el){el.focus();el.setSelectionRange(pos,pos)}}});
async function runLookup(term){term=(term||'').trim();if(!term){toast('先輸入要查的字');return}lookupBusy=true;lookupResult=null;render();
  const r=await lookup(term,lookupKind);lookupBusy=false;lookupResult=r;if(view==='lookup'&&!G)render()}

/* ===================== start ===================== */
$('#hudFox').innerHTML=fox(22);$('#hudCoinIcon').innerHTML=coin(14);
render();Store.init();getSample().then(sm=>{aiAvail=!!sm;if(view==='map'&&!G)render()});
</script>
